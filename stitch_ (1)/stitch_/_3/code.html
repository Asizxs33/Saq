<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Anti-Cheat Monitor - Lock Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4848e5",
              "background-light": "#f6f6f8",
              "background-dark": "#111121",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col overflow-hidden bg-slate-950">
<div class="absolute inset-0 z-0 bg-gradient-to-br from-slate-900 via-red-950/40 to-slate-900" data-alt="Abstract dark background with subtle red glow">
</div>
<div class="relative z-10 flex flex-col h-full items-center justify-center px-6">
<header class="absolute top-0 w-full flex items-center justify-center py-8">
<div class="flex items-center gap-3 text-slate-400">
<span class="material-symbols-outlined text-2xl">shield</span>
<h2 class="text-lg font-bold tracking-tight uppercase tracking-widest opacity-80">Anti-Cheat Monitor</h2>
</div>
</header>
<div class="flex flex-col items-center max-w-2xl w-full text-center">
<div class="mb-12 relative flex items-center justify-center">
<div class="absolute inset-0 bg-red-600/20 blur-3xl rounded-full"></div>
<div class="relative flex items-center justify-center size-32 bg-red-600/10 border-2 border-red-500/50 rounded-full text-red-500 shadow-[0_0_50px_rgba(239,68,68,0.3)]">
<span class="material-symbols-outlined !text-6xl" style="font-variation-settings: 'FILL' 1">lock</span>
</div>
</div>
<h1 class="text-slate-100 text-4xl md:text-5xl font-bold leading-tight mb-6 tracking-tight">
                    Test interrupted due to rule violation <br/>
<span class="text-red-500">(loss of focus)</span>
</h1>
<div class="h-1 w-24 bg-red-600 rounded-full mb-8"></div>
<p class="text-slate-400 text-lg md:text-xl font-normal max-w-lg leading-relaxed">
                    Your assessment access has been automatically restricted due to window switching or navigation activity.
                </p>
<div class="mt-12 p-4 bg-slate-900/50 border border-slate-800 rounded-lg backdrop-blur-sm">
<div class="flex items-center gap-3 text-slate-500 text-sm">
<span class="material-symbols-outlined text-lg">info</span>
<span>Please contact your administrator for further instructions.</span>
</div>
</div>
</div>
<footer class="absolute bottom-10 w-full flex justify-center opacity-30">
<p class="text-slate-500 text-xs tracking-widest uppercase">Security Protocol v4.2.0-Active</p>
</footer>
</div>
</div>
</body></html>
